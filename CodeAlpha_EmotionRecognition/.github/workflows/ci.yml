name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pytest
      - run: python -m py_compile app.py ui.py train.py features.py augment.py data.py ml.py dl.py predictor.py download_data.py make_demo_data.py
      - run: pytest -q
